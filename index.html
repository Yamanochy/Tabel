<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Табель — Новосибирск</title>
<meta name="theme-color" content="#14213D" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Табель" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          diesel: { DEFAULT: "#14213D", 700: "#1B2C50", 500: "#26406E" },
          route:  { DEFAULT: "#F2A93B", 600: "#D98F1F" },
          brick:  { DEFAULT: "#C6432B" },
          shift:  { DEFAULT: "#2F9E64" },
        },
        fontFamily: {
          display: ["'Space Grotesk'", "sans-serif"],
          sans: ["Inter", "-apple-system", "BlinkMacSystemFont", "sans-serif"],
          mono: ["'JetBrains Mono'", "monospace"],
        },
      },
    },
  };
</script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: #EEF0F3; }
  .font-num { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }
  .tab-active { color: #14213D !important; }
  .tab-active .tabicon-wrap { background: rgba(242,169,59,0.16); }
  .hidden { display: none; }
  ::-webkit-scrollbar { height: 6px; width: 6px; }
</style>
</head>
<body class="min-h-screen pb-24">

  <div id="auth-screen"></div>

  <div id="app-shell" class="hidden">
    <header class="bg-diesel text-white px-4 pt-5 pb-4">
      <div class="flex items-center gap-2 text-xs mb-3" id="user-bar"></div>
      <div class="flex items-center gap-2.5">
        <img src="icon-192.png" alt="" class="w-9 h-9 rounded-lg shadow" />
        <div class="text-2xl font-bold font-display tracking-tight">Табель</div>
      </div>
      <div class="text-xs text-white/60 mt-1 font-num tracking-wide">ТЕХНИКА · НОВОСИБИРСК</div>
    </header>

    <main id="app" class="max-w-md mx-auto px-3 mt-4 space-y-3"></main>

    <nav id="nav" class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 flex justify-around items-center py-2 shadow-[0_-2px_10px_rgba(0,0,0,0.05)] z-10" style="padding-bottom: max(0.5rem, env(safe-area-inset-bottom));"></nav>
  </div>

  <script src="firebase-config.js"></script>
  <script src="cloud-config.js"></script>
  <script src="access-config.js"></script>
  <script src="offline-queue.js"></script>
  <script src="app.js"></script>
  <script src="equipment.js"></script>
  <script src="drivers.js"></script>
  <script src="shifts.js"></script>
  <script src="advances.js"></script>
  <script src="dosatuy-ref.js"></script>
  <script src="auth.js"></script>
</body>
</html>
